<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f29"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="edBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="edGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#edBg)" stroke="url(#edBorder)" stroke-width="2.5"/>

  <!-- Neural Constellation & E Structure -->
  <g filter="url(#glow)">
    <!-- Outer 'E' swoop -->
    <path d="M 64 22 C 38 22 24 40 24 64 C 24 88 40 106 66 106 C 82 106 95 96 100 86 L 88 80 C 85 86 76 93 66 93 C 48 93 37 79 37 64 C 37 49 48 35 64 35 C 78 35 88 43 92 52 L 62 52 C 58 52 56 55 56 59 C 56 63 58 66 62 66 L 98 66 C 102 66 105 63 105 59 C 105 38 88 22 64 22 Z" fill="url(#edGlow)"/>

    <!-- Neural constellation brain interior nodes and synapses -->
    <g stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
      <line x1="56" y1="42" x2="68" y2="38" />
      <line x1="68" y1="38" x2="78" y2="44" />
      <line x1="56" y1="42" x2="52" y2="50" />
      <line x1="52" y1="50" x2="62" y2="52" />
      <line x1="56" y1="74" x2="66" y2="76" />
      <line x1="66" y1="76" x2="76" y2="72" />
      <line x1="56" y1="74" x2="50" y2="84" />
      <line x1="50" y1="84" x2="64" y2="88" />
    </g>

    <!-- Glowing synapse nodes -->
    <circle cx="56" cy="42" r="3" fill="#67e8f9" />
    <circle cx="68" cy="38" r="3.2" fill="#a5f3fc" />
    <circle cx="78" cy="44" r="2.8" fill="#c084fc" />
    <circle cx="52" cy="50" r="2.5" fill="#38bdf8" />
    <circle cx="56" cy="74" r="2.8" fill="#818cf8" />
    <circle cx="66" cy="76" r="3.2" fill="#c084fc" />
    <circle cx="76" cy="72" r="2.8" fill="#e879f9" />
    <circle cx="50" cy="84" r="2.6" fill="#38bdf8" />
    <circle cx="64" cy="88" r="3" fill="#67e8f9" />
  </g>
</svg>